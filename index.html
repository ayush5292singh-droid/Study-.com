<!DOCTYPE html>
<html>

<head>

<title>AI Study Genius</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<div class="app">


<h1>🤖 AI Study Genius</h1>


<div class="robot">

<div class="bot">
🤖📚
</div>

<h2 id="message">
Hello! I am your AI study assistant.
</h2>

</div>



<div class="card">

<h3>❓ Ask Study Question</h3>

<input 
id="question"
placeholder="Ask anything...">


<button onclick="askAI()">
Ask
</button>


<p id="answer">
Your answer will appear here.
</p>

</div>



<div class="card">

<h3>📝 Smart Notes</h3>

<textarea 
id="notes"
placeholder="Write your notes here">
</textarea>


</div>



<div class="card">

<h3>🎯 Today's Goal</h3>

<p>
Complete your study tasks and improve daily.
</p>


</div>



<button onclick="speak()">
🔊 Talk Robot
</button>


</div>


<script src="script.js"></script>


</body>

</html>
