<!DOCTYPE html>
<html>

<head>

<title>AI Study Genius</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<div class="app">


<h1>🤖 AI Study Genius</h1>


<div class="robot">

<div class="bot">
🤖📚
</div>

<h2 id="message">
Hello! I am your AI study assistant.
</h2>

</div>



<div class="card">

<h3>❓ Ask Study Question</h3>

<input 
id="question"
placeholder="Ask anything...">


<button onclick="askAI()">
Ask
</button>


<p id="answer">
Your answer will appear here.
</p>

</div>



<div class="card">

<h3>📝 Smart Notes</h3>

<textarea 
id="notes"
placeholder="Write your notes here">
</textarea>


</div>


<div class="card">

<h3>✅ Study To-Do List</h3>

<input id="task" placeholder="Add study task">


<button onclick="addTask()">
➕ Add Task
</button>


<div id="taskList">
No tasks added
</div>

</div>



<div class="card">

<h3>⏰ Study Timetable</h3>

<input id="subject" placeholder="Subject">


<input id="time" placeholder="Time">


<button onclick="addSchedule()">
📚 Add Schedule
</button>


<div id="scheduleList">
No schedule added
</div>

</div>



<div class="card">

<h3>📖 Subjects</h3>

<p>
Maths | Science | English | Other
</p>

</div>



</div>



<button onclick="speak()">
🔊 Talk Robot
</button>


</div>


<script src="script.js"></script>


</body>

</html>
